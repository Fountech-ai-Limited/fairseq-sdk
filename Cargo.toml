[workspace]
resolver = "2"
members = [
    "fairseq-core",
    "fairseq-crypto",
    "fairseq-lighthouse",
    "fairseq-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Fairseq <hello@fairseq.io>"]
repository = "https://github.com/fairseq/fairseq"
homepage = "https://fairseq.io"
documentation = "https://fairseq.io/docs"
keywords = ["blockchain", "zkp", "fairness", "ordering", "mev"]
categories = ["cryptography", "development-tools"]

[workspace.dependencies]
# Internal crates
fairseq-core = { path = "fairseq-core" }
fairseq-crypto = { path = "fairseq-crypto" }
fairseq-lighthouse = { path = "fairseq-lighthouse" }
fairseq-sdk = { path = "fairseq-sdk" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
rand = "0.8"
hex = "0.4"

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# WebSocket
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
config = "0.14"
dotenvy = "0.15"

# Async traits
async-trait = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true


